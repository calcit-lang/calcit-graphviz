on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Validate Calcit snapshot
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry run-tests --check-only
          calcit calcit.cirru analyze check-public \
            --ns 'triadica.$meta' --ns triadica.core --ns triadica.main --ns triadica.test --format json
          calcit calcit.cirru test --require-match --summary-only --format json
          calcit calcit.cirru docs format-md docs/generate-dot-source.md --check
          calcit calcit.cirru docs check-md docs/generate-dot-source.md --failures-only
          calcit calcit.cirru --entry run-tests
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru --entry run-tests analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

      - name: Build client with CDN asset URLs
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
          calcit calcit.cirru js
          sudo apt-get update
          sudo apt-get install --yes graphviz
          yarn render
          calcit calcit.cirru
          yarn vite build --base="$VITE_BASE_URL"

      - name: Check current production revision
        id: production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi

      - name: Upload static assets to COS
        timeout-minutes: 10
        if: steps.production.outputs.current == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
