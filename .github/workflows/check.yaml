on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Validate Calcit snapshot
        run: |
          caps --strict --ci
          mkdir -p .calcit/bin
          corepack enable --install-directory .calcit/bin
          export PATH="$PWD/.calcit/bin:$PATH"
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru fix --workflow strict --verify --format edn
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry run-tests --check-only
          calcit calcit.cirru --entry run-tests
          calcit calcit.cirru analyze deprecated --summary-only --format json
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru --entry run-tests analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

      - name: Build client with CDN asset URLs
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          calcit calcit.cirru js
          sudo apt-get update
          sudo apt-get install --yes graphviz
          yarn render
          yarn vite build --base="$VITE_BASE_URL"

      - name: Verify CDN asset references
        run: node scripts/verify-cdn-build.mjs

      - name: Upload static assets to COS
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@0ce57b26b03dbdd27a4a544a06d453415932c62d # v1.0.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Verify uploaded CDN assets
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/verify-cdn-build.mjs --remote
