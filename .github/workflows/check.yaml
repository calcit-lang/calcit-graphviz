on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0

      - name: Validate Calcit snapshot
        run: |
          caps --strict --ci
          mkdir -p .calcit/bin
          corepack enable --install-directory .calcit/bin
          export PATH="$PWD/.calcit/bin:$PATH"
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry run-tests --check-only
          calcit calcit.cirru --entry run-tests
          calcit calcit.cirru analyze dynamic-methods --max 0
          calcit calcit.cirru --entry run-tests analyze dynamic-methods --max 0
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru js
          sudo apt-get update
          sudo apt-get install --yes graphviz
          yarn render
          yarn vite build --base=./
